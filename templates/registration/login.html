{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورود به مرداس</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<style>
  .login-wrap{max-width:400px;margin:80px auto;background:#fff;padding:30px;
    border-radius:20px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
  .login-wrap h1{margin-top:0;font-size:22px;text-align:center}
  .login-wrap input{width:100%;padding:12px;border:1px solid #cbd5e1;
    border-radius:11px;margin:6px 0 14px}
  .login-wrap button{width:100%;background:#2563eb;color:#fff;
    padding:13px;border-radius:11px;font-size:15px}
  .err{color:#dc2626;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="login-wrap">
  <h1>⚡ اتاق فرمان مرداس</h1>
  {% if form.errors %}<div class="err">نام کاربری یا رمز اشتباه است.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>نام کاربری</label>
    <input name="username" required autofocus>
    <label>رمز عبور</label>
    <input name="password" type="password" required>
    <button type="submit">ورود</button>
  </form>
</div>
</body>
</html>
